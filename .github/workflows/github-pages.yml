name: github-pages
on:
  push:
    branches:
      - main
      - cursor/public-quote-site-d6b6
    paths:
      - "docs/**"
      - ".github/workflows/github-pages.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare GitHub Pages site
        run: |
          mkdir -p site
          cp -a docs/. site/
          touch site/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
